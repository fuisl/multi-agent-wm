defaults:
  - _self_
  - launcher: local
  - data: multipusht
  - model: lewm

output_model_name: lewm
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
# episode: val holds whole unseen episodes (whole scenes for multi-agent data), so val loss measures
# generalization | window: the official LeWM random window split, whose val windows overlap train frames
split_by: episode
seed: 3072
img_size: 224
embed_dim: 192
history_size: 3

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0
  default_root_dir: ${hydra:runtime.output_dir}

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

num_preds: 1

# transfer: start from a trained model instead of random init
init:
  ckpt: null        # state dict under $STABLEWM_HOME/checkpoints, e.g. lewm/pusht/weights.pt
  freeze: []        # JEPA parts kept fixed (no grad, eval mode), e.g. [encoder, projector]
scalers_from: null  # dataset whose stats z-score action/proprio/state (null: the training data); use the init model's data so its inputs keep their meaning

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
