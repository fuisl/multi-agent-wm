defaults:
  - _self_
  - override hydra/launcher: basic

env: # world.MultiPushT kwargs
  n_agents: 2
  others: distinct
  agent_collisions: true
  max_episode_steps: 200

seed: 0
num_episodes: 1000
policy: heuristic # random | heuristic
policy_kwargs: {} # collect.HeuristicPolicy kwargs, e.g. {p_wander: 0.3}

output:
  name: multipusht_${env.n_agents}a_${policy}.h5 # relative to $STABLEWM_HOME/datasets
  format: hdf5 # raw pixels; lance JPEG-encodes them
  mode: error # append | overwrite | error

hydra:
  run:
    dir: ${oc.env:STABLEWM_HOME}/outputs/${hydra:job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${oc.env:STABLEWM_HOME}/multirun/${hydra:job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
