defaults:
  - _self_
  - override hydra/launcher: basic

env: # world.MultiPushT kwargs
  n_agents: 2
  others: visible
  agent_collisions: true
  max_episode_steps: 200

seed: 0
img_size: 224
num_episodes: 1000
policy: random # random | heuristic

output:
  name: multipusht_${env.n_agents}a_${policy} # relative to $STABLEWM_HOME
  format: lance

hydra:
  run:
    dir: ${oc.env:STABLEWM_HOME}/outputs/${hydra:job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${oc.env:STABLEWM_HOME}/multirun/${hydra:job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
