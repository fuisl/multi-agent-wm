defaults:
  - launcher: local
  - solver: cem
  - _self_

env:
  n_agents: 2
  others: distinct       # other agents in an agent's view: distinct (orange) | visible (blue, like self) | hidden
  agent_collisions: true # agents collide with each other (and walls); false = original kinematic agents
  agent_force: null      # force threshold (world.py): max push per agent; null = original physics. Coop setting: 1e5
  solver_iterations: null # pymunk solver iterations (null = 10); 50 with agent_force, so a lone push does not leak through the T's friction
  success: pusht         # pusht: original test, T pose + agent 0 at its goal spot | block: T pose only (ends early)
  exact_reset_render: true # draw the goal image and first frame at the exact requested state, not one physics step later (physics unchanged)
  jpeg_quality: null     # 95: JPEG 4:2:0 round-trip on every agent view, like the official Push-T frames (null = clean renders)

policy: lewm/pusht       # used for every agent (independent instances); ckpt relative to $STABLEWM_HOME/checkpoints, or random
policies: null           # optional per-agent list, e.g. [lewm/pusht, random]
joint: null              # joint-action checkpoints (action = [self, partner], 2 agents): decentralized = every agent plans
                         # the joint action on its own view and executes its own half | centralized = agent 0 plans for both

dataset:
  keys_to_cache:
    - action
    - proprio
    - state

seed: 42

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip

# same protocol as eval/pusht.yaml (same episodes / start steps / goals for a given seed)
eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: pusht_expert_train
  goal: render           # render: per-agent goal in the same rendering (T at goal + self) | dataset: official goal frame
  dataset_first_frame: false # true = plan the first step from the dataset frame, as eval.py does (only meaningful for 1 agent)
  swm_reset: false       # true = reset like swm.World (random reset, then set state); with the flags above reproduces eval.py exactly (1 agent)
  scalers: train         # action/proprio z-scores from each policy's training data (config.yaml next to the ckpt) | eval: from dataset_name
  video: true

output:
  dir: multipusht/${env.n_agents}a_${env.others} # relative to $STABLEWM_HOME
