defaults:
  - launcher: local
  - solver: cem
  - _self_

env:
  n_agents: 2
  others: distinct       # other agents in an agent's view: distinct (orange) | visible (blue, like self) | hidden
  self_marker: ring      # ring around self in its own view | none (original look)
  agent_collisions: true # agents collide with each other (and walls); false = original kinematic agents
  success: block         # block: T pose only | pusht: original criterion (block + agent 0 position)

policy: lewm/pusht       # used for every agent (independent instances); ckpt relative to $STABLEWM_HOME/checkpoints, or random
policies: null           # optional per-agent list, e.g. [lewm/pusht, random]

dataset:
  keys_to_cache:
    - action
    - proprio
    - state

seed: 42

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip

# same protocol as eval/pusht.yaml (same episodes / start steps / goals for a given seed)
eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: pusht_expert_train
  goal: render           # render: per-agent goal in the same rendering (T at goal + self) | dataset: official goal frame
  dataset_first_frame: false # true = plan the first step from the dataset frame, as eval.py does (only meaningful for 1 agent)
  swm_reset: false       # true = reset like swm.World (random reset, then set state); with the flags above reproduces eval.py exactly (1 agent)
  video: true

output:
  dir: multipusht/${env.n_agents}a_${env.others}_${env.self_marker} # relative to $STABLEWM_HOME
