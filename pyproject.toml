[project]
name = "multi-agent-wm"
version = "0.1.0"
description = "LeWM-style world models for multi-agent Push-T (VMAS + stable-worldmodel)"
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3.7",
    "pettingzoo>=1.27.0",
    "stable-worldmodel[env,format,train]>=0.1.1",
    "transformers>=4.50,<5",
    "vmas>=1.5.2",
]

[tool.uv.extra-build-dependencies]
box2d-py = ["swig"]

# CUDA 12.8 wheels: the H100 cluster's driver is 12.8, and PyPI's default torch wheels need CUDA 13
[tool.uv]
# 2.11 is the newest torch built for CUDA 12.8; the index's newer, untagged wheels are CUDA 13 builds
constraint-dependencies = ["torch<2.12", "torchvision<0.27"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
